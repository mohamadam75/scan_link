name: Daily VPN source monitor

on:
  schedule:
    # 06:00 Iran time (UTC+03:30)
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-vpn-monitor
  cancel-in-progress: false

jobs:
  collect-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect sources and test TCP reachability
        env:
          SUBSCRIPTION_URL: ${{ secrets.SUBSCRIPTION_URL }}
        run: python monitor.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: refresh daily VPN endpoint report"
            git push
          fi
