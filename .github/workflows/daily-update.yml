name: Daily VPN source monitor

on:
  push:
    branches: [main]
    paths-ignore:
      - "configs/**"
      - "reports/**"
  schedule:
    # 07:00 Iran time (UTC+03:30) = 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-vpn-monitor
  cancel-in-progress: false

jobs:
  collect-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run parser unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect sources and test TCP reachability
        run: python monitor.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: refresh daily VPN endpoint report"
            git push
          fi
